<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121417">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Geschichten — a local-first German study tool.">
  <title>Geschichten</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <a href="#/today" class="brand" aria-label="Today">Geschichten</a>
    <div id="streak" class="streak" title="Streak"></div>
    <a href="#/settings" class="iconbtn" aria-label="Settings">⚙</a>
  </header>
  <div id="roadmap-mini" class="roadmap-mini"></div>
  <main id="view" tabindex="-1"></main>
  <nav class="tabs" aria-label="Blocks">
    <a href="#/grammar" data-tab="grammar"><span class="n">1</span><span class="l">Grammar</span></a>
    <a href="#/review" data-tab="review"><span class="n">2</span><span class="l">Review</span></a>
    <a href="#/input" data-tab="input"><span class="n">3</span><span class="l">Input</span></a>
    <a href="#/output" data-tab="output"><span class="n">4</span><span class="l">Output</span></a>
    <a href="#/errors" data-tab="errors"><span class="n">5</span><span class="l">Errors</span></a>
  </nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript>Geschichten needs JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
